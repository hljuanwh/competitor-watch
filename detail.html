<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资讯 · 动态解读</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315182e'/%3E%3Cpath d='M8 12.5V9a1 1 0 0 1 1-1h3.5M19.5 8H23a1 1 0 0 1 1 1v3.5M24 19.5V23a1 1 0 0 1-1 1h-3.5M12.5 24H9a1 1 0 0 1-1-1v-3.5' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23ff5a2c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="app">
  <aside class="side"></aside>

  <main class="main">
    <header class="top">
      <div class="crumb">观测空间 <svg class="i" style="width:12px;height:12px"><use href="#i-right"/></svg> <a href="index.html">CCM 云文档</a> <svg class="i" style="width:12px;height:12px"><use href="#i-right"/></svg> <a href="feed.html">动态</a> <svg class="i" style="width:12px;height:12px"><use href="#i-right"/></svg> <b>解读</b></div>
      <div class="actions">
        <button class="btn" id="btn-flag"><svg class="i"><use href="#i-alert"/></svg>标记有误</button>
        <button class="btn primary" id="btn-push"><svg class="i"><use href="#i-send"/></svg>推送到飞书</button>
      </div>
    </header>

    <div class="content">
      <div style="padding:14px 0 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><a class="back" href="feed.html"><svg class="i"><use href="#i-left"/></svg>返回全部动态</a><span style="display:flex;gap:6px"><a class="btn sm" id="prev"><svg class="i"><use href="#i-left"/></svg>较新</a><a class="btn sm" id="next">较早<svg class="i"><use href="#i-right"/></svg></a></span></div>

      <div class="cols" style="margin-top:0">
        <article class="panel doc" id="doc"></article>

        <div class="aside">
          <section class="panel" aria-label="动态信息">
            <div class="block">
              <div class="block-title"><h2>动态信息</h2></div>
              <dl class="kv" id="kv"></dl>
            </div>
            <div class="block">
              <div class="block-title"><h2>推送情况<span class="demo">示意</span></h2></div>
              <div class="list-plain" id="push-list"></div>
            </div>
          </section>

          <section class="panel" aria-label="同一竞品的其他动态">
            <div class="block">
              <div class="block-title"><h2 id="rel-title">同一竞品</h2></div>
              <div class="rel" id="rel"></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script src="data-b2b.js"></script>
<script src="data-news.js"></script>
<script src="spaces.js"></script>
<script src="shell.js"></script>
<script>
const { SP, subHits, D, P, T, U, esc, md, kindHTML, tagHTML, logoHTML, modal, val, checked, toast, pushDialog } = CW;
CW.side('feed');

/* 完整解读样例：每个空间写了一条（spaces.js 的 SAMPLE），其余条目显示同样的版式 */
const SAMPLE = Math.max(0, U.findIndex(u => u[4].includes(SP.SAMPLE.find)));
const AI = { [SAMPLE]: SP.SAMPLE.html };
const KL = { rt: '实时动态', daily: '每日汇总', mon: '月报', year: '年报' };

function render() {
  const m = /^#u(\d+)$/.exec(location.hash);
  const i = m && U[+m[1]] ? +m[1] : SAMPLE;
  cur = i;
  const [d, p, t, k, title, body, [srcName, srcUrl]] = U[i];
  const { m: mo, day, w } = md(d);
  const mo0 = d.slice(0, 2);
  const same = U.map((u, j) => j).filter(j => j !== i && U[j][2] === t && U[j][0].slice(0, 2) === mo0);
  const sameP = U.map((u, j) => j).filter(j => j !== i && U[j][1] === p && U[j][0].slice(0, 2) === mo0);

  document.title = `资讯 · ${title}`;
  document.getElementById('doc').innerHTML = `
    <div class="doc-eyebrow">${logoHTML(p, true)}<span class="who" style="color:var(--ink-2);font-weight:500;font-size:13px">${P[p].name}</span>${tagHTML(t)}${kindHTML(k)}<span>· 2026 年 ${mo} 月 ${day} 日 周${w}</span></div>
    <h1>${esc(title)}</h1>
    <p class="lead">${esc(body)}</p>

    <h2 class="sec" id="s-src">原文</h2>
    <div class="quote">
      <span style="color:var(--ink-3)">[原文摘录：开发阶段由抓取结果自动填入，设计稿不编造引文]</span>
      <cite><a href="${srcUrl}" target="_blank" rel="noopener">${esc(srcName)}</a><svg class="i"><use href="#i-out"/></svg></cite>
    </div>

    <h2 class="sec" id="s-ai">为什么值得关注<span class="kind blue"><svg class="i" style="width:11px;height:11px"><use href="#i-spark"/></svg>AI 解读</span></h2>
    <div class="ai-box">
      ${AI[i] || `<p style="color:var(--ink-3)">设计稿只为「${esc(U[SAMPLE][4])}」这一条写了完整解读，这里显示同样的位置。<a class="link" href="detail.html#u${SAMPLE}">看样例</a></p>`}
    </div>

    <h2 class="sec" id="s-same">同主题的 ${mo} 月动态${tagHTML(t)}<small>${same.length} 条</small></h2>
    ${same.length ? `<div class="mini">${same.map(j => {
      const [dj, pj, , kj, tj] = U[j]; const x = md(dj);
      return `<a href="detail.html#u${j}"><span class="d num">${x.m}/${x.day}</span>${logoHTML(pj, true)}<span class="t">${esc(tj)}</span>${kindHTML(kj)}</a>`;
    }).join('')}</div>` : `<p style="color:var(--ink-3)">${mo} 月没有同主题的其他动态。</p>`}

    <div class="doc-foot">这篇解读由 AI 根据 1 个${k === 'off' ? '官方' : '媒体'}来源写成。「AI 解读」部分是观点，事实以原文为准；发现错误请点右上角「标记有误」。</div>`;

  document.getElementById('kv').innerHTML = `
    <dt>竞品</dt><dd>${logoHTML(p, true)}${P[p].name}</dd>
    <dt>主题</dt><dd>${tagHTML(t)}</dd>
    <dt>来源</dt><dd>${kindHTML(k)}<a class="src" style="margin:0" href="${srcUrl}" target="_blank" rel="noopener">${esc(srcName)}<svg class="i"><use href="#i-out"/></svg></a></dd>
    <dt>发布</dt><dd class="num">2026-${d}</dd>
    <dt>月报</dt><dd><a class="link" href="monthly.html#m${mo}">2026 年 ${mo} 月月报</a></dd>`;

  document.getElementById('rel-title').innerHTML = `同一竞品 · ${mo} 月<small>${sameP.length} 条</small>`;
  document.getElementById('rel').innerHTML = sameP.length ? sameP.map(j => {
    const [dj, pj, tj, , tl] = U[j]; const x = md(dj);
    return `<a href="detail.html#u${j}">${logoHTML(pj, true)}<span><span class="t">${esc(tl)}</span><small>${x.m} 月 ${x.day} 日 · ${T[tj][0]}</small></span></a>`;
  }).join('') : `<p class="note" style="margin:0">${P[p].name} ${mo} 月只有这一条。<a class="link" href="feed.html#p-${p}">看全部</a></p>`;
  /* 推送情况：当前空间前三个群订阅，按订阅条件判断这条会不会发过去（示意） */
  document.getElementById('push-list').innerHTML = SP.SEED.filter(s => s.kind === 'group').slice(0, 3).map(s => {
    const k = s.k.find(x => x === 'rt' || x === 'daily') || s.k[0], hit = s.on && (k === 'rt' || k === 'daily') && subHits(s, i);
    return `<div><span><b>${esc(s.name)}</b> · ${KL[k]}</span><span class="st ${hit ? 'ok' : 'idle'}">${hit ? '已送达' : k === 'mon' ? '进月报' : '不在范围'}</span></div>`; }).join('');
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  prev.toggleAttribute('hidden', i === 0); prev.href = `detail.html#u${i - 1}`;
  next.toggleAttribute('hidden', i === U.length - 1); next.href = `detail.html#u${i + 1}`;
  window.scrollTo(0, 0);
}
let cur = SAMPLE;
document.getElementById('btn-push').onclick = () => pushDialog('动态 · ' + U[cur][4]);
document.getElementById('btn-flag').onclick = () => modal({
  title: '标记有误', sub: U[cur][4], ok: '提交',
  body: `<div class="field"><span class="lbl">哪里不对</span><div class="pills">
      <label class="pill"><input type="checkbox" name="w" value="fact">摘要与原文不符</label>
      <label class="pill"><input type="checkbox" name="w" value="theme">主题归错了</label>
      <label class="pill"><input type="checkbox" name="w" value="src">来源或日期有误</label>
      <label class="pill"><input type="checkbox" name="w" value="dup">重复收录</label></div></div>
    <div class="field"><label for="fl-theme">改成哪个主题（可选）</label><select class="input" id="fl-theme" name="theme"><option value="">不改</option>${Object.keys(T).map(k => `<option value="${k}">${T[k][0]}</option>`).join('')}</select></div>
    <div class="field"><label for="fl-note">补充说明</label><textarea class="input" id="fl-note" name="note" rows="3" placeholder="例如：原文写的是仅限网页端"></textarea></div>`,
  onOk(f, err) { if (!checked(f, 'w').length && !val(f, 'note')) { err('选一项问题，或写一句说明'); return false; } toast('已提交，管理员复核后会更新这条动态'); },
});
render();
addEventListener('hashchange', render);
</script>
</body>
</html>
