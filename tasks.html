<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资讯 · 任务</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315182e'/%3E%3Cpath d='M8 12.5V9a1 1 0 0 1 1-1h3.5M19.5 8H23a1 1 0 0 1 1 1v3.5M24 19.5V23a1 1 0 0 1-1 1h-3.5M12.5 24H9a1 1 0 0 1-1-1v-3.5' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23ff5a2c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
</head>
<!-- 运行时间、耗时、数据源状态为示意；撰写和推送对应的动态来自 data.js 的真实收录 -->
<body>
<div class="app">
  <aside class="side"></aside>

  <main class="main">
    <header class="top">
      <div class="crumb">观测空间 <svg class="i" style="width:12px;height:12px"><use href="#i-right"/></svg> <a href="index.html">CCM 云文档</a> <svg class="i" style="width:12px;height:12px"><use href="#i-right"/></svg> <b>任务</b><span>· 抓取、撰写、推送的运行情况</span></div>
      <div class="actions">
        <a class="btn" href="config.html#sources"><svg class="i"><use href="#i-gear"/></svg>管理来源</a>
        <button class="btn primary" id="btn-crawl"><svg class="i"><use href="#i-refresh"/></svg>立即抓取</button>
      </div>
    </header>

    <div class="content">
      <section class="hero" aria-label="任务概况">
        <div>
          <h1>每天 09:00 自动抓取</h1>
          <p id="hero-p">平台每天读一遍 8 个竞品的 12 个来源。发现新内容先去重，确认是新动态再交给 AI 写摘要、归主题，最后按订阅推送。哪个来源连续失败，会在这里标出来。</p>
          <div class="hero-meta" id="hero-meta"></div>
        </div>
        <div class="kpis" id="kpis"></div>
      </section>

      <section class="panel" aria-label="流水线">
        <div class="panel-head">
          <h2 id="flow-title"></h2>
          <span class="st ok" id="flow-st"></span>
        </div>
        <div class="flow" id="flow"></div>
      </section>

      <div class="cols">
        <section class="panel" aria-label="运行记录">
          <div class="panel-head">
            <h2>运行记录<small id="runs-sub"></small><span class="demo">时间为示意</span></h2>
            <div class="seg" role="group" aria-label="任务类型" id="f-type"><button data-v="" class="on">全部</button><button data-v="crawl">抓取</button><button data-v="write">撰写</button><button data-v="push">推送</button><button data-v="mon">月报</button></div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>时间</th><th>任务</th><th>内容</th><th>结果</th><th class="r">耗时</th></tr></thead>
              <tbody id="runs"></tbody>
            </table>
          </div>
        </section>

        <div class="aside">
          <section class="panel" aria-label="数据源">
            <div class="block">
              <div class="block-title"><h2>数据源<small id="src-n">12 个</small><span class="demo">示意</span></h2><a class="link" href="config.html#sources">管理</a></div>
              <div id="sources"></div>
            </div>
            <div class="block">
              <div class="block-title"><h2>定时计划</h2></div>
              <div class="list-plain">
                <div><span>抓取全部来源</span><b class="num">每天 09:00</b></div>
                <div><span>新动态推送</span><b>撰写完成后</b></div>
                <div><span>生成月报</span><b class="num">每月最后一天 18:00</b></div>
                <div><span>生成年报</span><b class="num">12 月 31 日 18:00</b></div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script src="data-b2b.js"></script>
<script src="data-news.js"></script>
<script src="spaces.js"></script>
<script src="shell.js"></script>
<script>
const { CUR, DAY, TODAY, FULL, FULL_END, shiftDay, SP, FAILING, subHits, D, P, U, esc, inMonth, toast, busy } = CW;
CW.side('tasks');

/* 数据源来自当前空间（spaces.js）；第 4 项为 true 的来源演示「连续超时」 */
const SRC = SP.SRC, N = SRC.length, BAD = FAILING ? FAILING[0] : '';
document.getElementById('hero-p').textContent = `平台每天读一遍 ${SP.ORDER.length} 个${SP.unit}的 ${N} 个来源。发现新内容先去重，确认是新动态再交给 AI 写摘要、归主题，最后按订阅推送。哪个来源连续失败，会在这里标出来。`;
document.getElementById('src-n').textContent = `${N} 个`;
let ddFailing = !!FAILING;

/* 最近一次有新动态的那天 */
const LAST = U[0][0], lastIdx = U.map((_, i) => i).filter(i => U[i][0] === LAST);
const RT_GROUPS = SP.SEED.filter(s => s.on && s.kind === 'group' && s.k.includes('rt')).map(s => [s.name, i => subHits(s, i)]);
const groupsFor = ids => RT_GROUPS.filter(([, f]) => ids.some(f)).map(([g]) => g);

function header() {
  const ok = SRC.length - (ddFailing ? 1 : 0);
  document.getElementById('hero-meta').innerHTML = ddFailing
    ? `<span class="chip">1 个来源需处理</span>${BAD}连续 3 天超时`
    : `<span class="chip" style="background:var(--ok-soft);color:var(--ok)">全部正常</span>${N} 个来源都能正常读取`;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="kpi-value num">${N}</div><div class="kpi-label">数据源<span class="demo">示意</span></div></div>
    <div class="kpi"><div class="kpi-value num">${ok}</div><div class="kpi-label">运行正常</div></div>
    <div class="kpi"><div class="kpi-value num">${SRC.length - ok}</div><div class="kpi-label">需处理</div></div>
    <div class="kpi"><div class="kpi-value num">09:00</div><div class="kpi-label">下次抓取 · ${+shiftDay(1).slice(0, 2)} 月 ${+shiftDay(1).slice(3)} 日</div></div>`;
}

/* ---------- 流水线 ---------- */
const STEPS = () => {
  const g = groupsFor(lastIdx);
  return [
    ['抓取', N, '个来源', ddFailing ? `${N - 1} 个成功，1 个超时` : `${N} 个全部成功`],
    ['发现候选', lastIdx.length + 2, '条', '来源里新出现的条目'],
    ['去重确认', lastIdx.length, '条新动态', '2 条是已收录动态的转载'],
    ['AI 撰写', lastIdx.length, '篇', '摘要、主题、解读'],
    ['推送', g.length, '个群', g.join('、')],
  ];
};
function flow(state = 'done', at = 5) {
  const [m, d] = LAST.split('-').map(Number);
  document.getElementById('flow-title').innerHTML = state === 'run' ? `正在抓取<small>${CUR} 月 ${DAY} 日</small>` : `最近一次有新动态<small>${m} 月 ${d} 日</small><span class="demo">数量为示意</span>`;
  const st = document.getElementById('flow-st');
  st.className = 'st ' + (state === 'run' ? 'run' : 'ok');
  st.textContent = state === 'run' ? `第 ${Math.min(at + 1, 5)} 步 / 共 5 步` : '今天 09:00 已运行 · 没有新动态';
  document.getElementById('flow').innerHTML = STEPS().map(([name, v, unit, desc], k) => {
    const cls = state === 'run' ? (k < at ? '' : k === at ? ' now' : ' wait') : '';
    const icon = cls === ' now' ? '<svg class="i spin"><use href="#i-refresh"/></svg>' : cls === ' wait' ? '' : '<svg class="i"><use href="#i-check"/></svg>';
    const showV = state === 'run' ? (k < at ? (k === 0 ? N : 0) : '—') : v;
    return `<div class="step${cls}"><div class="step-dot">${icon}</div><div class="step-name">${name}</div><div class="step-val num">${showV}<small>${unit}</small></div><div class="step-desc">${state === 'run' ? (k < at ? (k === 0 ? '读取完成' : '没有新内容') : '等待中') : esc(desc)}</div></div>`;
  }).join('');
}

/* ---------- 运行记录：按 11 月和 10 月底的真实动态推出 ---------- */
const TYPE = { crawl: ['抓取', ''], write: ['AI 撰写', 'blue'], push: ['推送', ''], mon: ['月报', 'sig'] };
function buildRuns() {
  const rows = [];
  const days = [0, -1, -2, -3, -4, -5, -6].map(shiftDay);
  for (const d of days) {
    const ids = U.map((_, i) => i).filter(i => U[i][0] === d);
    const fail = ddFailing && d >= shiftDay(-2);
    if (ids.length) {
      const g = groupsFor(ids);
      rows.push([`${d} 09:10`, 'push', esc(ids.map(i => U[i][4]).join('；')), ['ok', `${g.length} 个群`], '4 秒']);
      rows.push([`${d} 09:06`, 'write', esc(ids.map(i => U[i][4]).join('；')), ['ok', '完成'], `${ids.length * 38} 秒`]);
    }
    rows.push([`${d} 09:00`, 'crawl', `${N} 个来源`, [fail ? 'warn' : 'ok', `${ids.length ? `新增 ${ids.length}` : '无新增'}${fail ? ' · 1 个超时' : ''}`], fail ? '6 分 48 秒' : '4 分 26 秒']);
  }
  rows.push([`${FULL_END} 18:01`, 'push', `${FULL} 月月报推送到 ${SP.SEED.filter(s => s.on && s.kind === 'group' && s.k.includes('mon')).length} 个群`, ['ok', '已送达'], '6 秒']);
  rows.push([`${FULL_END} 18:00`, 'mon', `生成 ${FULL} 月月报，依据 ${inMonth(FULL).length} 条动态`, ['ok', '完成'], '2 分 14 秒']);
  return rows;
}
let RUNS = buildRuns(), ftype = '';
function runs() {
  const list = RUNS.filter(r => !ftype || r[1] === ftype);
  document.getElementById('runs-sub').textContent = `${+shiftDay(-6).slice(0, 2)} 月 ${+shiftDay(-6).slice(3)} 日以来 · ${list.length} 条`;
  document.getElementById('runs').innerHTML = list.map(([t, ty, what, [st, res], dur]) => `
    <tr><td class="muted num" style="white-space:nowrap">${t}</td><td><span class="kind ${TYPE[ty][1]}">${TYPE[ty][0]}</span></td><td style="color:var(--ink)">${what}</td><td><span class="st ${st}">${res}</span></td><td class="r muted num" style="white-space:nowrap">${dur}</td></tr>`).join('');
}

/* ---------- 数据源 ---------- */
function sources() {
  document.getElementById('sources').innerHTML = SRC.map(([n, p, sub, dd], k) => {
    if (dd && ddFailing) return `<div class="src-row"><b>${n}</b><button class="btn sm" data-retry="${k}">重试</button><small class="warn">${sub} · 连续 3 天超时，上次成功 ${shiftDay(-3)}</small></div>`;
    const last = p ? U.find(u => u[1] === p && u[3] === 'off') : null;
    return `<div class="src-row"><b>${n}</b><span class="st ok">正常</span><small>${sub} · ${TODAY} 09:00${last ? ` · 最近收录 ${last[0]}` : ''}</small></div>`;
  }).join('');
}

document.getElementById('sources').addEventListener('click', e => {
  const b = e.target.closest('[data-retry]'); if (!b) return;
  busy(b, '重试中', 1500, () => {
    ddFailing = false; RUNS = buildRuns();
    RUNS.unshift([TODAY + ' ' + new Date().toTimeString().slice(0, 5), 'crawl', `${BAD}（手动重试）`, ['ok', '成功 · 无新增'], '41 秒']);
    header(); flow(); runs(); sources(); toast(`${BAD}已恢复，没有新内容`);
  });
});
document.getElementById('f-type').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { ftype = b.dataset.v; runs(); } });
document.getElementById('btn-crawl').onclick = e => {
  const btn = e.currentTarget; let at = 0;
  busy(btn, '抓取中…', 3200);
  flow('run', 0);
  const tick = setInterval(() => { at++; flow('run', at); if (at >= 5) { clearInterval(tick); setTimeout(() => {
    RUNS.unshift([TODAY + ' ' + new Date().toTimeString().slice(0, 5), 'crawl', `${N} 个来源（手动）`, [ddFailing ? 'warn' : 'ok', `无新增${ddFailing ? ' · 1 个超时' : ''}`], '3 秒']);
    flow(); runs(); toast(ddFailing ? `抓取完成：没有新动态，${BAD}仍然超时` : '抓取完成：没有新动态', ddFailing ? 'warn' : ''); }, 300); } }, 550);
};

header(); flow(); runs(); sources();
</script>
</body>
</html>
