<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资讯 · 总览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315182e'/%3E%3Cpath d='M8 12.5V9a1 1 0 0 1 1-1h3.5M19.5 8H23a1 1 0 0 1 1 1v3.5M24 19.5V23a1 1 0 0 1-1 1h-3.5M12.5 24H9a1 1 0 0 1-1-1v-3.5' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23ff5a2c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
</head>
<!-- 版式与 竞品观测-总览.html 原稿一致；数据换成 10 月（最近完整月），全部来自 data.js 的真实收录 -->
<body>
<div class="app">
  <aside class="side"></aside>

  <main class="main">
    <header class="top">
      <div class="crumb">观测空间 <svg class="i" style="width:12px;height:12px"><use href="#i-right"/></svg> <b>CCM 云文档</b><span>· 在线文档、表格、幻灯片与文档内 AI</span></div>
      <div class="actions">
        <button class="btn" id="btn-push"><svg class="i"><use href="#i-send"/></svg>推送到飞书</button>
        <button class="btn primary" id="btn-crawl"><svg class="i"><use href="#i-refresh"/></svg>立即抓取</button>
      </div>
    </header>

    <div class="content">
      <section class="hero" aria-label="本月结论">
        <div>
          <h1 id="h1"></h1>
          <p id="lead"></p>
          <div class="hero-meta"><span class="chip" id="chip"></span><span id="hero-meta"></span></div>
        </div>
        <div class="kpis" id="kpis"></div>
      </section>

      <section class="panel" aria-label="竞品更新信号">
        <div class="panel-head">
          <h2 id="tl-title"><small>每个点是一条动态</small></h2>
          <div class="legend" id="legend"></div>
        </div>
        <div class="tl" id="timeline"></div>
      </section>

      <div class="cols">
        <section class="panel" aria-label="最新动态">
          <div class="panel-head">
            <h2>最新动态</h2>
            <a class="link" href="feed.html">全部动态<svg class="i" style="width:14px;height:14px"><use href="#i-right"/></svg></a>
          </div>
          <div class="tabs" role="tablist" id="tabs"></div>
          <div id="feed"></div>
          <div style="height:8px"></div>
        </section>

        <div class="aside">
          <section class="panel" aria-label="主题分布与来源">
            <div class="block">
              <div class="block-title"><h2 id="bars-title"></h2></div>
              <div class="bars" id="bars"></div>
            </div>
            <div class="block">
              <div class="block-title"><h2 id="src-title"></h2></div>
              <div class="stack" aria-hidden="true" id="stack"></div>
              <div class="src-list" id="src-list"></div>
              <p class="note" id="src-note"></p>
            </div>
            <div id="reports"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script src="data-b2b.js"></script>
<script src="data-news.js"></script>
<script src="spaces.js"></script>
<script src="shell.js"></script>
<script>
const { SP, D, P, ORDER, T, U, esc, inMonth, feedHTML, logoHTML, toast, busy, pushDialog } = CW;
document.getElementById('src-note').textContent = SP.srcNote;
CW.side('index');

/* 首页展示最新的月份（11 月，进行中）；和上个月比同期（1 日到今天），不拿半个月比整月 */
const M = D.MONTHS[0], R = D.REPORT[M], LIVE = !!R.partial;
const TODAY = +D.NOW.slice(8), LAST = new Date(2026, M, 0).getDate();
const idx = inMonth(M), prevAll = inMonth(M - 1);
const prev = LIVE ? prevAll.filter(i => +U[i][0].slice(3) <= TODAY) : prevAll;
const off = idx.filter(i => U[i][3] === 'off').length;
const delta = idx.length - prev.length;

document.getElementById('h1').innerHTML = R.h1;
document.getElementById('lead').textContent = R.lead;
document.getElementById('chip').textContent = LIVE ? `${M} 月进行中` : `${M} 月月报结论`;
document.getElementById('hero-meta').textContent = LIVE ? `依据截至 ${M} 月 ${TODAY} 日的 ${idx.length} 条动态 · 完整月报 ${M}-${LAST} 18:00 生成` : `依据 ${idx.length} 条动态 · 2026-${M}-${LAST} 生成`;
document.getElementById('kpis').innerHTML = `
  <div class="kpi"><div class="kpi-value num">${ORDER.length}</div><div class="kpi-label">关注竞品</div></div>
  <div class="kpi"><div class="kpi-value num">${U.length}</div><div class="kpi-label">累计收录 · 7 月起</div></div>
  <div class="kpi"><div class="kpi-value num">${idx.length}<sup${delta < 0 ? ' class="down"' : ''}>${delta > 0 ? '+' : delta < 0 ? '−' : '±'}${Math.abs(delta)}</sup></div><div class="kpi-label">${M} 月新增 · 较 ${M - 1} 月${LIVE ? '同期' : ''} ${prev.length} 条</div></div>
  <div class="kpi"><div class="kpi-value num">${off}</div><div class="kpi-label">${M} 月来自官方日志</div></div>`;

/* 图例与主题计数：按当月条数排序 */
const tCount = t => idx.filter(i => U[i][2] === t).length;
const themes = Object.keys(T).sort((a, b) => tCount(b) - tCount(a));
document.getElementById('legend').innerHTML = themes.map(t => `<span><i style="background:${T[t][1]}"></i>${T[t][0]}</span>`).join('');

/* ---------- 信号时间轴：当月 1 日 – 月末 ---------- */
document.getElementById('tl-title').insertAdjacentText('afterbegin', `${M} 月更新信号`);
const SPAN = new Date(2026, M, 0).getDate(), START = new Date(2026, M - 1, 1);
const pos = d => { const [m, day] = d.split('-').map(Number); return ((new Date(2026, m - 1, day) - START) / 864e5 + .5) / SPAN * 100; };
const pad = n => String(n).padStart(2, '0');
const weeks = [1, 8, 15, 22, 29].map(d => `${pad(M)}-${pad(d)}`);
/* 进行中的月份：今天以后的部分淡化，并标出「今天」 */
const restL = LIVE ? pos(`${pad(M)}-${pad(TODAY)}`) + .5 / SPAN * 100 : 100;
const rest = LIVE ? `<div class="tl-rest" style="left:${restL}%"></div>` : '';
const order = [...ORDER].sort((a, b) => idx.filter(i => U[i][1] === b).length - idx.filter(i => U[i][1] === a).length);
let tl = `<div class="tl-axis"><div></div><div class="tl-track">
  ${weeks.map(w => `<div class="tl-month" style="left:${pos(w) - .5 / SPAN * 100}%">${+w.slice(0, 2)}/${+w.slice(3)}</div>`).join('')}${LIVE ? `<div class="tl-today" style="left:${restL}%">今天</div>` : ''}
</div><div></div></div>`;
for (const p of order) {
  const items = idx.filter(i => U[i][1] === p);
  let dots = rest + weeks.slice(1).map(w => `<div class="tl-grid" style="left:${pos(w) - .5 / SPAN * 100}%"></div>`).join('');
  if (!items.length) dots += `<span class="tl-empty">${M} 月${LIVE ? '暂' : ''}无收录</span>`;
  const seen = {};
  for (const i of items) {
    const [d, , t, , title] = U[i];
    const n = seen[d] = (seen[d] || 0) + 1, same = items.filter(j => U[j][0] === d).length;
    const dy = (n - 1) * 9 - (same - 1) * 4.5;
    dots += `<a class="dot${pos(d) > 60 ? ' tip-r' : ''}" href="detail.html#u${i}" style="left:${pos(d)}%;top:calc(50% + ${dy}px);background:${T[t][1]}" data-tip="${esc(`${+d.slice(0, 2)}/${+d.slice(3)} ${title}`)}" aria-label="${esc(title)}"></a>`;
  }
  tl += `<div class="tl-row">
    <div class="tl-name"><div class="logo sm ${P[p].cls}">${P[p].mark}</div><span>${P[p].name}</span></div>
    <div class="tl-track">${dots}</div>
    <div class="tl-count num">${items.length}<small>条</small></div>
  </div>`;
}
document.getElementById('timeline').innerHTML = tl;

/* ---------- 最新动态：按主题筛选 ---------- */
const tabs = document.getElementById('tabs');
tabs.innerHTML = `<span class="tab on" role="tab" tabindex="0" aria-selected="true" data-t="">${M} 月<span class="num">${idx.length}</span></span>` +
  themes.filter(tCount).map(t => `<span class="tab" role="tab" tabindex="0" aria-selected="false" data-t="${t}"><i style="background:${T[t][1]}"></i>${T[t][0]}<span class="num">${tCount(t)}</span></span>`).join('');
const renderFeed = t => { document.getElementById('feed').innerHTML = feedHTML(idx.filter(i => !t || U[i][2] === t)); };
const pick = el => { tabs.querySelectorAll('.tab').forEach(x => { x.classList.toggle('on', x === el); x.setAttribute('aria-selected', x === el); }); renderFeed(el.dataset.t); };
tabs.addEventListener('click', e => { const el = e.target.closest('.tab'); if (el) pick(el); });
tabs.addEventListener('keydown', e => { const el = e.target.closest('.tab'); if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(el); } });
renderFeed('');

/* ---------- 右栏 ---------- */
const max = Math.max(...themes.map(tCount));
document.getElementById('bars-title').innerHTML = `${M} 月主题分布<small>${idx.length} 条</small>`;
document.getElementById('bars').innerHTML = themes.map(t => `
  <div class="bar"><span>${T[t][0]}</span><div class="bar-track"><div class="bar-fill" style="width:${tCount(t) / max * 100}%;background:${T[t][1]}"></div></div><span class="num">${tCount(t)}</span></div>`).join('');
document.getElementById('src-title').innerHTML = `来源构成<small>${M} 月 ${idx.length} 条</small>`;
document.getElementById('stack').innerHTML = `<span style="flex:${off};background:var(--ok)"></span><span style="flex:${idx.length - off};background:#b9bccb"></span>`;
document.getElementById('src-list').innerHTML = `
  <div><i style="background:var(--ok)"></i>厂商官方更新日志<b class="num">${off}</b></div>
  <div><i style="background:#b9bccb"></i>媒体与发布会报道<b class="num">${idx.length - off}</b></div>`;
const strip = h => h.replace(/<[^>]+>/g, '').replace(/^\d+ 月[^，]*，/, '');
document.getElementById('reports').innerHTML = [M, M - 1].map(m => `
  <a class="report-link" href="monthly.html#m${m}"><span><span class="serif">2026 年 ${m} 月月报${D.REPORT[m].partial ? '<span class="kind" style="margin-left:6px;vertical-align:1px">进行中</span>' : ''}</span><small>${inMonth(m).length} 条 · ${strip(D.REPORT[m].h1)}</small></span><svg class="i" style="color:var(--ink-3)"><use href="#i-right"/></svg></a>`).join('');

/* ---------- 顶栏按钮 ---------- */
document.getElementById('btn-push').onclick = () => pushDialog(`${M} 月${LIVE ? '进展' : '月报'} · ${strip(R.h1)}`);
document.getElementById('btn-crawl').onclick = e => busy(e.currentTarget, '抓取中…', 1600, () => toast(`抓取完成：${SP.SRC.length} 个来源都没有新动态`));
</script>
</body>
</html>
