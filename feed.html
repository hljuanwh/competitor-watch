<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竞品观测 · 动态</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2315182e'/%3E%3Cpath d='M8 12.5V9a1 1 0 0 1 1-1h3.5M19.5 8H23a1 1 0 0 1 1 1v3.5M24 19.5V23a1 1 0 0 1-1 1h-3.5M12.5 24H9a1 1 0 0 1-1-1v-3.5' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23ff5a2c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="app">
  <aside class="side"></aside>

  <main class="main">
    <header class="top">
      <div class="crumb">观测空间 <svg class="i" style="width:12px;height:12px"><use href="#i-right"/></svg> <a href="index.html">CCM 云文档</a> <svg class="i" style="width:12px;height:12px"><use href="#i-right"/></svg> <b>动态</b><span>· 竞品每次更新都会生成一条</span></div>
      <div class="actions">
        <button class="btn" id="btn-export"><svg class="i"><use href="#i-download"/></svg>导出</button>
        <button class="btn primary" id="btn-crawl"><svg class="i"><use href="#i-refresh"/></svg>立即抓取</button>
      </div>
    </header>

    <div class="content">
      <section class="hero" aria-label="动态概况">
        <div>
          <h1>全部动态</h1>
          <p>每条动态由 AI 读完原始来源后写成两句话摘要，归到一个主题并附原文链接。点标题看完整解读。</p>
          <div class="hero-meta"><span class="chip" id="chip"></span>按发布时间倒序 · 2026-07-01 起收录</div>
        </div>
        <div class="kpis" id="kpis"></div>
      </section>

      <section class="panel" aria-label="筛选">
        <div class="filters">
          <div class="f-row">
            <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="搜索标题、摘要或来源" autocomplete="off"></label>
            <div class="seg" role="group" aria-label="时间范围" id="f-m"></div>
            <div class="seg" role="group" aria-label="来源类型" id="f-k">
              <button data-v="" class="on">全部来源</button><button data-v="off">官方</button><button data-v="media">媒体</button>
            </div>
          </div>
          <div class="f-row"><span class="f-label">竞品</span><div class="f-tabs" id="f-p"></div></div>
          <div class="f-row"><span class="f-label">主题</span><div class="f-tabs" id="f-t"></div></div>
        </div>
        <div class="result-bar">
          <span id="result"></span>
          <span style="display:flex;gap:16px;flex-wrap:wrap">
            <button class="btn link-btn sm" id="btn-reset" hidden>清空筛选</button>
            <a class="link" href="subscribe.html#new" id="to-sub"><svg class="i" style="width:14px;height:14px"><use href="#i-bell"/></svg>&nbsp;把这组筛选推送到飞书群</a>
          </span>
        </div>
      </section>

      <div class="cols">
        <section class="panel" aria-label="动态列表">
          <div class="panel-head">
            <h2 id="list-title"></h2>
            <div class="seg" role="group" aria-label="排序" id="f-sort"><button data-v="date" class="on">最新</button><button data-v="comp">按竞品</button></div>
          </div>
          <div id="feed"></div>
          <div style="height:8px"></div>
        </section>

        <div class="aside">
          <section class="panel" aria-label="竞品与来源分布">
            <div class="block">
              <div class="block-title"><h2 id="by-p-title"></h2></div>
              <div class="bars" id="by-p"></div>
            </div>
            <div class="block">
              <div class="block-title"><h2 id="src-title"></h2></div>
              <div class="stack" aria-hidden="true" id="stack"></div>
              <div class="src-list" id="src-list"></div>
            </div>
          </section>

          <section class="panel" aria-label="保存的筛选">
            <div class="block">
              <div class="block-title"><h2>保存的筛选</h2><button class="btn sm ghost" id="btn-save"><svg class="i"><use href="#i-plus"/></svg>保存当前</button></div>
              <div class="list-plain" id="saved"></div>
              <p class="note">数字是全部收录里符合条件的条数。保存的筛选只存在这台设备上。</p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script src="shell.js"></script>
<script>
const { D, P, ORDER, T, U, esc, md, kindHTML, tagHTML, logoHTML, toast, busy, modal, val, store } = CW;
CW.side('feed');

/* ---------- 筛选状态 ---------- */
const S = { q: '', m: 'all', k: '', p: '', t: '', sort: 'date' };
const ALL = U.map((_, i) => i);
const match = (i, s = S, skip) => {
  const [d, p, t, k, title, body, [src]] = U[i];
  if (skip !== 'm' && s.m !== 'all' && +d.slice(0, 2) !== +s.m) return false;
  if (skip !== 'k' && s.k && k !== s.k) return false;
  if (skip !== 'p' && s.p && p !== s.p) return false;
  if (skip !== 't' && s.t && t !== s.t) return false;
  if (s.q) { const q = s.q.toLowerCase(); if (![title, body, src, P[p].name, T[t][0]].some(x => x.toLowerCase().includes(q))) return false; }
  return true;
};

/* ---------- 头部 ---------- */
const off = U.filter(u => u[3] === 'off').length;
document.getElementById('chip').textContent = `累计 ${U.length} 条`;
document.getElementById('kpis').innerHTML = `
  <div class="kpi"><div class="kpi-value num">${U.length}</div><div class="kpi-label">累计收录 · 7 月起</div></div>
  <div class="kpi"><div class="kpi-value num">${CW.inMonth(11).length}</div><div class="kpi-label">11 月新增 · 截至 15 日</div></div>
  <div class="kpi"><div class="kpi-value num">${off}</div><div class="kpi-label">来自官方日志</div></div>
  <div class="kpi"><div class="kpi-value num">${new Set(U.map(u => u[1])).size}<sup class="down">/${ORDER.length}</sup></div><div class="kpi-label">有过更新的竞品</div></div>`;
document.getElementById('f-m').innerHTML = ['all', ...D.MONTHS].map(m => `<button data-v="${m}"${m === 'all' ? ' class="on"' : ''}>${m === 'all' ? '全部' : m + ' 月'}</button>`).join('');

/* ---------- 渲染 ---------- */
const hl = s => { const e = esc(s); if (!S.q) return e; const q = esc(S.q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); return e.replace(new RegExp(q, 'gi'), x => `<mark class="hit">${x}</mark>`); };
function item(i) {
  const [d, p, t, k, title, body, [srcName, srcUrl]] = U[i];
  return `<article class="item">
    ${logoHTML(p)}
    <div>
      <div class="meta"><span class="who">${P[p].name}</span>${tagHTML(t)}${kindHTML(k)}</div>
      <h3><a href="detail.html#u${i}">${hl(title)}</a></h3>
      <p>${hl(body)}</p>
      <div class="item-links">
        <a class="src" href="${srcUrl}" target="_blank" rel="noopener">${esc(srcName)}<svg class="i"><use href="#i-out"/></svg></a>
        <a class="src read" href="detail.html#u${i}">阅读解读<svg class="i"><use href="#i-right"/></svg></a>
      </div>
    </div>
  </article>`;
}
function tabsHTML(key, list, label, extra) {
  return `<span class="tab${S[key] ? '' : ' on'}" role="button" tabindex="0" data-k="${key}" data-v="">全部<span class="num">${ALL.filter(i => match(i, S, key)).length}</span></span>` +
    list.map(v => { const n = ALL.filter(i => match(i, { ...S, [key]: v })).length;
      return `<span class="tab${S[key] === v ? ' on' : ''}" role="button" tabindex="0" data-k="${key}" data-v="${v}"${n || S[key] === v ? '' : ' style="opacity:.45"'}>${extra(v)}${label(v)}<span class="num">${n}</span></span>`; }).join('');
}
function render() {
  const idx = ALL.filter(i => match(i));
  document.getElementById('f-p').innerHTML = tabsHTML('p', ORDER, p => P[p].name, p => logoHTML(p, true));
  document.getElementById('f-t').innerHTML = tabsHTML('t', Object.keys(T), t => T[t][0], t => `<i style="background:${T[t][1]}"></i>`);

  const parts = [S.m === 'all' ? '全部月份' : S.m + ' 月', S.p ? P[S.p].name : '全部竞品', S.t ? T[S.t][0] : '全部主题'];
  if (S.k) parts.push(S.k === 'off' ? '只看官方' : '只看媒体');
  if (S.q) parts.push(`含「${esc(S.q)}」`);
  document.getElementById('result').innerHTML = `共 <b class="num">${idx.length}</b> 条 · ${parts.join(' · ')}`;
  const dirty = S.q || S.m !== 'all' || S.k || S.p || S.t;
  document.getElementById('btn-reset').hidden = !dirty;
  document.getElementById('list-title').innerHTML = `${S.m === 'all' ? '2026 年 7–11 月' : `2026 年 ${S.m} 月`}<small>${idx.length} 条</small>`;

  let html = '';
  if (!idx.length) {
    html = `<div class="empty"><b>没有符合条件的动态</b>${S.p === 'wps' || S.p === 'dd' ? `${P[S.p].name} 在所选范围内没有可核实的公开更新。` : '换个关键词，或者放宽筛选条件。'}<br><button class="btn" data-reset>清空筛选</button></div>`;
  } else if (S.sort === 'comp') {
    for (const p of ORDER) { const g = idx.filter(i => U[i][1] === p); if (!g.length) continue;
      html += `<div class="day"><b>${P[p].name}</b><span class="num">${g.length} 条</span></div>` + g.map(item).join(''); }
  } else {
    let last = '', lastM = 0;
    for (const i of idx) {
      const d = U[i][0], m = +d.slice(0, 2);
      if (S.m === 'all' && m !== lastM) { html += `<div class="day" style="padding-top:22px"><b style="font-size:17px">${m} 月</b><span class="num">${idx.filter(j => +U[j][0].slice(0, 2) === m).length} 条</span></div>`; lastM = m; last = ''; }
      if (d !== last) { const x = md(d); html += `<div class="day"><b class="num">${x.m}月${x.day}日</b><span>周${x.w}</span></div>`; last = d; }
      html += item(i);
    }
  }
  document.getElementById('feed').innerHTML = html;

  /* 右栏跟随当前时间范围 */
  const scope = ALL.filter(i => match(i, { ...S, p: '', t: '', k: '', q: '' }));
  const lab = S.m === 'all' ? '全部' : S.m + ' 月';
  const cnt = p => scope.filter(i => U[i][1] === p).length, max = Math.max(1, ...ORDER.map(cnt));
  document.getElementById('by-p-title').innerHTML = `按竞品<small>${lab} ${scope.length} 条</small>`;
  document.getElementById('by-p').innerHTML = ORDER.map(p => `
    <div class="bar" style="grid-template-columns:118px 1fr 22px"><span>${P[p].name}</span><div class="bar-track"><div class="bar-fill" style="width:${cnt(p) / max * 100}%;background:var(--ink)"></div></div><span class="num">${cnt(p)}</span></div>`).join('');
  const so = scope.filter(i => U[i][3] === 'off').length;
  document.getElementById('src-title').innerHTML = `来源构成<small>${lab} ${scope.length} 条</small>`;
  document.getElementById('stack').innerHTML = `<span style="flex:${so};background:var(--ok)"></span><span style="flex:${scope.length - so};background:#b9bccb"></span>`;
  document.getElementById('src-list').innerHTML = `<div><i style="background:var(--ok)"></i>厂商官方更新日志<b class="num">${so}</b></div><div><i style="background:#b9bccb"></i>媒体与发布会报道<b class="num">${scope.length - so}</b></div>`;
  renderSaved();
}

/* ---------- 保存的筛选（本机） ---------- */
const PRESET = [
  { name: '国内竞品', desc: '腾讯、钉钉、WPS', f: { q: '', m: 'all', k: '', p: '', t: '', ps: ['tx', 'dd', 'wps'] } },
  { name: '幻灯片相关', desc: '标题或摘要含「演示」「幻灯片」「PowerPoint」「Slides」', f: { q: '', m: 'all', k: '', p: '', t: '', kw: ['演示', '幻灯片', 'PowerPoint', 'Slides', 'PPT'] } },
  { name: '只看官方日志', desc: '', f: { q: '', m: 'all', k: 'off', p: '', t: '' } },
];
let saved = store.get('feed-saved', []);
const presetMatch = (i, f) => (!f.ps || f.ps.includes(U[i][1])) && (!f.kw || f.kw.some(w => (U[i][4] + U[i][5]).includes(w))) && match(i, f);
function renderSaved() {
  const all = [...PRESET, ...saved];
  document.getElementById('saved').innerHTML = all.map((s, n) => `
    <div><button class="linkish" data-saved="${n}"><b>${esc(s.name)}</b>${s.desc ? ` · ${esc(s.desc)}` : ''}</button><span class="num">${ALL.filter(i => presetMatch(i, s.f)).length}</span></div>`).join('');
}

/* ---------- 事件 ---------- */
let timer;
document.getElementById('q').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 120); });
const seg = (id, key) => document.getElementById(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S[key] = b.dataset.v; render(); });
seg('f-m', 'm'); seg('f-k', 'k'); seg('f-sort', 'sort');
const onTab = e => { const t = e.target.closest('.tab'); if (!t) return; S[t.dataset.k] = S[t.dataset.k] === t.dataset.v ? '' : t.dataset.v; render(); };
['f-p', 'f-t'].forEach(id => { const el = document.getElementById(id); el.addEventListener('click', onTab); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTab(e); } }); });
function reset() {
  Object.assign(S, { q: '', m: 'all', k: '', p: '', t: '' });
  document.getElementById('q').value = '';
  document.querySelectorAll('#f-m button, #f-k button').forEach(b => b.classList.toggle('on', b.dataset.v === '' || b.dataset.v === 'all'));
  render();
}
document.getElementById('btn-reset').onclick = reset;
document.getElementById('feed').addEventListener('click', e => { if (e.target.closest('[data-reset]')) reset(); });
document.getElementById('saved').addEventListener('click', e => {
  const b = e.target.closest('[data-saved]'); if (!b) return;
  const s = [...PRESET, ...saved][+b.dataset.saved];
  reset();
  Object.assign(S, { m: s.f.m, k: s.f.k, p: s.f.p, t: s.f.t, q: s.f.q || '' });
  document.getElementById('q').value = S.q;
  document.querySelectorAll('#f-m button').forEach(x => x.classList.toggle('on', x.dataset.v === String(S.m)));
  document.querySelectorAll('#f-k button').forEach(x => x.classList.toggle('on', x.dataset.v === S.k));
  render();
  if (s.f.ps || s.f.kw) { // 预设里的多竞品 / 关键词条件，单独渲染
    const idx = ALL.filter(i => presetMatch(i, s.f));
    document.getElementById('feed').innerHTML = idx.length ? idx.map(item).join('') : '<div class="empty"><b>没有符合条件的动态</b></div>';
    document.getElementById('result').innerHTML = `共 <b class="num">${idx.length}</b> 条 · 保存的筛选「${esc(s.name)}」`;
    document.getElementById('list-title').innerHTML = `${esc(s.name)}<small>${idx.length} 条</small>`;
    document.getElementById('btn-reset').hidden = false;
  }
});
document.getElementById('btn-save').onclick = () => {
  const dirty = S.q || S.m !== 'all' || S.k || S.p || S.t;
  if (!dirty) { toast('先选一些筛选条件再保存', 'warn'); return; }
  const desc = [S.m !== 'all' && S.m + ' 月', S.p && P[S.p].name, S.t && T[S.t][0], S.k && (S.k === 'off' ? '官方' : '媒体'), S.q && `含「${S.q}」`].filter(Boolean).join('、');
  modal({
    title: '保存当前筛选', sub: desc, ok: '保存',
    body: `<div class="field"><label for="sv-name">名称</label><input class="input" id="sv-name" name="name" maxlength="20" placeholder="例如：微软的正文内联"></div>`,
    onOk(f, err) { const name = val(f, 'name'); if (!name) { err('给这组筛选起个名字'); return false; }
      saved.push({ name, desc, f: { q: S.q, m: S.m, k: S.k, p: S.p, t: S.t } }); store.set('feed-saved', saved); renderSaved(); toast(`已保存「${name}」`); },
  });
};
document.getElementById('btn-export').onclick = () => {
  const idx = ALL.filter(i => match(i));
  modal({ title: '导出动态', sub: `当前筛选下共 ${idx.length} 条`, ok: '导出',
    body: `<div class="field"><span class="lbl">格式</span><div class="pills">
      <label class="pill"><input type="radio" name="fmt" value="飞书文档" checked>飞书文档</label>
      <label class="pill"><input type="radio" name="fmt" value="Excel">Excel</label>
      <label class="pill"><input type="radio" name="fmt" value="Markdown">Markdown</label></div></div>
      <p class="note">导出内容包含日期、竞品、主题、来源类型、标题、摘要和原文链接。</p>`,
    onOk(f) { toast(`已生成${f.querySelector('[name=fmt]:checked').value}，共 ${idx.length} 条`); } });
};
document.getElementById('btn-crawl').onclick = e => busy(e.currentTarget, '抓取中…', 1600, () => toast('抓取完成：12 个来源都没有新动态'));

/* 从其他页带筛选进来：feed.html#p-google、#t-inline、#m10 */
const h = location.hash.slice(1);
if (/^p-\w+$/.test(h) && P[h.slice(2)]) S.p = h.slice(2);
if (/^t-\w+$/.test(h) && T[h.slice(2)]) S.t = h.slice(2);
if (/^m\d+$/.test(h) && D.MONTHS.includes(+h.slice(1))) { S.m = h.slice(1); document.querySelectorAll('#f-m button').forEach(x => x.classList.toggle('on', x.dataset.v === S.m)); }
render();
</script>
</body>
</html>
